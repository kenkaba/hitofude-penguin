<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ひとふでペンギン</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ひとふで">
<meta name="theme-color" content="#BFE3F2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#BFE3F2; --sky2:#F2FBFE; --ink:#19304D; --ink-soft:#4F6A85;
  --ui:#FFFFFF; --ui-line:#CDE6F1; --pen:#1F9FD6; --pen-deep:#127FB0;
  --warm:#FF8A3D; --warm-deep:#D9651B; --danger:#D7355A; --gold:#FFC93C;
  --sea1:#2C8CC8; --sea2:#134A77; --scrim:rgba(20,45,75,.28);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#081729; --sky2:#1B3D60; --ink:#EAF6FB; --ink-soft:#9DB8CF;
    --ui:#12263D; --ui-line:#28496A; --sea1:#1B5F92; --sea2:#0A2C4C; --scrim:rgba(0,8,20,.5);
  }
}
:root[data-theme="dark"]{
  --sky1:#081729; --sky2:#1B3D60; --ink:#EAF6FB; --ink-soft:#9DB8CF;
  --ui:#12263D; --ui-line:#28496A; --sea1:#1B5F92; --sea2:#0A2C4C; --scrim:rgba(0,8,20,.5);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;display:block;touch-action:none}
button{font-family:var(--body);color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
.hidden{display:none!important}

/* ---- HUD ---- */
#hud{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;pointer-events:none}
#topbar{display:flex;align-items:center;gap:6px;max-width:560px;margin:0 auto}
.icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:var(--ui);box-shadow:0 3px 0 var(--ui-line);
  display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ui-line)}
#lvTitle{flex:1;min-width:0;font-weight:800;font-size:16px;background:var(--ui);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--ui-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvTitle b{font-family:var(--display);font-weight:400;font-size:20px;margin-right:6px;color:var(--pen)}
#strokeCount{font-weight:800;font-size:15px;background:var(--ui);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 var(--ui-line);flex:none;color:var(--danger)}
#meltTag{font-size:15px;background:var(--ui);border-radius:12px;padding:8px 9px;box-shadow:0 3px 0 var(--ui-line);flex:none}
#keyCount{font-weight:800;font-size:15px;background:var(--ui);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 var(--ui-line);flex:none}
#keyCount.got{background:var(--gold);color:#19304D}
#fishCount{font-weight:800;font-size:15px;background:var(--ui);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 var(--ui-line);flex:none}
#inkWrap{max-width:560px;margin:10px auto 0;display:flex;align-items:center;gap:8px}
#inkLabel{font-size:12px;font-weight:800;color:var(--ink-soft);flex:none;background:var(--ui);border-radius:99px;padding:2px 8px}
#inkTrack{position:relative;flex:1;height:14px;border-radius:99px;background:var(--ui);box-shadow:inset 0 0 0 2px var(--ui-line);overflow:visible}
#inkFill{position:absolute;left:2px;top:2px;bottom:2px;border-radius:99px;background:linear-gradient(90deg,var(--pen-deep),var(--pen));width:calc(100% - 4px);transition:width .08s linear}
#parMark{position:absolute;top:-7px;width:0;height:28px;border-left:2px dashed var(--gold)}
#parMark::after{content:"★";position:absolute;top:-16px;left:-7px;font-size:13px;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.25)}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 16px;display:flex;justify-content:center;gap:10px;pointer-events:none}
.cta{pointer-events:auto;font-weight:800;font-size:19px;padding:14px 30px;border-radius:999px;background:var(--warm);color:#fff;
  box-shadow:0 5px 0 var(--warm-deep);letter-spacing:.04em}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--warm-deep)}
.ghost{pointer-events:auto;font-weight:800;font-size:15px;padding:14px 18px;border-radius:999px;background:var(--ui);box-shadow:0 5px 0 var(--ui-line)}
.ghost:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ui-line)}
.ghost:disabled{opacity:.45}
#hint{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,460px);text-wrap:balance;text-align:center;font-weight:800;font-size:14px;line-height:1.6;
  background:var(--ui);padding:9px 14px;border-radius:14px;box-shadow:0 3px 0 var(--ui-line);pointer-events:none;transition:opacity .4s}

/* ---- overlays ---- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#title{background:linear-gradient(180deg,transparent 0%,transparent 55%,var(--scrim) 100%);justify-content:flex-start;padding-top:12vh}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,76px);line-height:1.02;text-align:center;margin:0;color:var(--ink);
  letter-spacing:.02em;text-shadow:0 4px 0 var(--ui)}
.tag{margin:14px 0 0;font-weight:800;font-size:15px;color:var(--ink-soft)}
#title .actions{position:absolute;bottom:calc(12vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.sound-tog{font-weight:800;font-size:13px;color:var(--ink);padding:8px 14px;border-radius:999px;background:var(--ui);opacity:.85}

#select{background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{background:var(--ui);border-radius:26px;padding:20px 18px 22px;width:min(100%,460px);box-shadow:0 8px 0 var(--ui-line);max-height:100%;overflow:auto}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 4px}
.panel .sub{margin:0 0 16px;color:var(--ink-soft);font-weight:800;font-size:13px}
#grid{display:flex;flex-direction:column;gap:14px}
.chap h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 2px}
.chap .req{font-weight:800;font-size:12px;color:var(--ink-soft);margin:0 0 8px}
.chap h3 .gf{font-size:13px;margin-left:8px;opacity:.5}
.chap h3 .gf.got{opacity:1}
.chap.secret h3{color:#C98A00}
.tile .md{position:absolute;right:3px;top:2px;font-size:12px}
.chap .row5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{position:relative;text-align:center;border-radius:14px;padding:9px 2px 7px;background:linear-gradient(180deg,#F7FDFF,#DDF1F9);color:#19304D;
  box-shadow:inset 0 0 0 2px #BFE2F0,0 4px 0 #A9D5E8;min-height:0}
.tile:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #BFE2F0,0 2px 0 #A9D5E8}
.tile .n{display:block;font-family:var(--display);font-size:20px;line-height:1.1;color:#127FB0}
.tile .nm{display:none}
.tile .nm{display:block;font-weight:800;font-size:13px;margin-top:6px}
.tile .st{display:block;font-size:10px;letter-spacing:0;color:#C9D9E2;margin-top:3px}
.tile .st i{font-style:normal;color:#F2A900}
.tile[disabled]{opacity:.45}
.tile[disabled] .n::after{content:"🔒";font-size:11px;display:block}
.tile[disabled] .st{display:none}
.tile .lock{display:block;font-weight:800;font-size:11px;color:#4F6A85;margin-top:3px}
#hint.new{background:var(--ink);color:var(--ui);box-shadow:none}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}
.total{font-weight:800;font-size:14px;color:var(--ink-soft)}

#wardrobe{background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#wdPrev{position:static;inset:auto;display:block;width:240px;height:160px;margin:0 auto 6px;border-radius:16px;background:linear-gradient(180deg,#CFEAF6,#F2FBFE)}
.wdh{font-family:var(--display);font-weight:400;font-size:16px;margin:12px 0 6px}
.wdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wd{border-radius:14px;padding:8px 4px;background:#EEF8FC;color:#19304D;box-shadow:inset 0 0 0 2px #CDE6F1;font-weight:800;font-size:13px;line-height:1.3}
.wd small{display:block;font-size:10px;color:#6A8299;font-weight:800}
.wd.on{box-shadow:inset 0 0 0 3px var(--warm);background:#FFF1E6}
.wd[disabled]{opacity:.5}
.wd .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
#result{background:var(--scrim);justify-content:flex-end;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#result .panel{text-align:center}
#resTitle{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 6px}
#resSub{margin:0 0 12px;font-weight:800;color:var(--ink-soft);font-size:14px;line-height:1.6}
#stars{display:flex;justify-content:center;gap:14px;margin:6px 0 10px}
.star{width:78px;text-align:center}
.star .s{font-size:44px;line-height:1;color:var(--ui-line);display:block;transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.star.on .s{color:var(--gold);transform:scale(1)}
.star small{display:block;font-weight:800;font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.35}
#result .extra{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 12px}
#result .extra .ink{font-weight:800;font-size:13px;color:var(--ink-soft)}
.badge{font-weight:800;font-size:14px;padding:5px 12px;border-radius:999px}
.badge.medal{background:#FFE9A8;color:#8A5A00}
.badge.goldfish{background:#FFF4C2;color:#9A6A00;box-shadow:0 0 0 2px #FFD44D inset}
.badge.dim{font-size:12px;color:var(--ink-soft);background:transparent}
.badge.streak{background:#FFE1CC;color:#B4480F;box-shadow:0 0 0 2px #FF8A3D inset}
.badge.near{background:#E6E0FF;color:#4B3A9A}
#resBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
@media (prefers-reduced-motion:reduce){.star .s{transition:none}}
@media (max-width:420px){#strokeCount,#keyCount,#fishCount{padding:8px 7px}#meltTag{padding:8px 6px}#lvTitle{padding:6px 7px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="ゲーム画面"></canvas>

  <div id="hud" class="hidden">
    <div id="topbar">
      <button class="icon-btn" id="btnMenu" aria-label="ステージ選択へ">≡</button>
      <div id="lvTitle"></div>
      <div id="strokeCount" class="chip hidden" aria-label="引ける線の本数"></div>
      <div id="meltTag" class="hidden" aria-label="溶ける線の面">💧</div>
      <div id="keyCount" class="hidden" aria-label="鍵"></div>
      <div id="fishCount" aria-label="集めた魚"></div>
      <button class="icon-btn" id="btnRetry" aria-label="最初からやり直す">↻</button>
    </div>
    <div id="inkWrap">
      <span id="inkLabel">インク</span>
      <div id="inkTrack"><div id="inkFill"></div><div id="parMark" title="ここより少なければ★"></div></div>
    </div>
  </div>
  <div id="hint" class="hidden"></div>
  <div id="bottom" class="hidden">
    <button class="ghost" id="btnUndo">1本もどす</button>
    <button class="cta" id="btnGo">出発！</button>
  </div>

  <section class="screen" id="title">
    <h1 class="logo">ひとふで<br>ペンギン</h1>
    <p class="tag">線を描くと、氷になる。</p>
    <div class="actions">
      <button class="cta" id="btnPlay">あそぶ</button>
      <button class="ghost" id="btnWardrobeT">きせかえ</button>
      <button class="sound-tog" id="btnSound">サウンド：オン</button>
    </div>
  </section>

  <section class="screen hidden" id="select">
    <div class="panel">
      <h2>ステージ</h2>
      <p class="sub">★はゴール・魚・インク節約の3つ</p>
      <div id="grid"></div>
      <div class="row"><span class="total" id="totalStars"></span><span style="display:flex;gap:8px"><button class="ghost" id="btnWardrobe">きせかえ</button><button class="ghost" id="btnBackTitle">タイトル</button></span></div>
    </div>
  </section>

  <section class="screen hidden" id="wardrobe">
    <div class="panel">
      <h2>きせかえ</h2>
      <p class="sub" id="wdStat"></p>
      <canvas id="wdPrev" width="240" height="160" aria-label="きせかえのプレビュー"></canvas>
      <h3 class="wdh">かぶりもの</h3><div class="wdgrid" id="wdHats"></div>
      <h3 class="wdh">線の色</h3><div class="wdgrid" id="wdPens"></div>
      <div class="row"><span></span><button class="cta" id="btnWdClose">もどる</button></div>
    </div>
  </section>
  <section class="screen hidden" id="result">
    <div class="panel">
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
      <div id="stars"></div>
      <div id="resBtns"></div>
    </div>
  </section>
</div>

<script>
// ===== ひとふでペンギン core: physics + levels (shared by game and tests) =====
(function (root) {
  const W = 600, H = 900, SEA = 850;
  const G = 0.34, R = 16, WALK = 1.7, MAXV = 22, SUB = 4, LINE_T = 5;
  const MU = 0.03, BOOST = 11, TIME_LIMIT = 60 * 25, CRUMBLE_T = 26;

  function corners(b) {
    const a = (b.a || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), hw = b.w / 2, hh = b.h / 2;
    return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([x, y]) => [b.x + x * c - y * s, b.y + x * s + y * c]);
  }
  function inRect(px, py, b, pad) {
    const a = -(b.a || 0) * Math.PI / 180, dx = px - b.x, dy = py - b.y;
    const lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a);
    return Math.abs(lx) <= b.w / 2 + pad && Math.abs(ly) <= b.h / 2 + pad;
  }
  function seg(a, b, t, kind, extra) {
    return Object.assign({ ax: a[0], ay: a[1], bx: b[0], by: b[1], t: t || 0, kind: kind || 'solid' }, extra || {});
  }
  function distToSeg(px, py, s) {
    const ex = s.bx - s.ax, ey = s.by - s.ay, l2 = ex * ex + ey * ey || 1e-6;
    let u = ((px - s.ax) * ex + (py - s.ay) * ey) / l2; u = u < 0 ? 0 : u > 1 ? 1 : u;
    const cx = s.ax + u * ex, cy = s.ay + u * ey;
    return Math.hypot(px - cx, py - cy);
  }

  // igloo: solid dome + roofed doorway. door = -1 (opening faces left) or 1 (faces right)
  const IG_R = 46, IG_DOOR_H = 42, IG_PORCH = 10;
  function igloo(g) {
    const d = g.door || -1, cx = g.x - 6 * d, y = g.y;
    const th = Math.asin(IG_DOOR_H / IG_R);            // angle above ground where the doorway roof meets the dome
    const roofX = cx + d * IG_R * Math.cos(th);        // dome x at doorway-roof height (door side)
    const outerX = cx + d * (IG_R + IG_PORCH);         // front edge of porch roof
    // dome arc from doorway roof, over the top, down to ground on the back side
    const arc = [];
    const n = 14;
    for (let i = 0; i <= n; i++) {
      const a = th + (Math.PI - th) * i / n;          // th .. PI measured from door side
      arc.push([cx + d * IG_R * Math.cos(a), y - IG_R * Math.sin(a)]);
    }
    return { d, cx, y, roofX, outerX, roofY: y - IG_DOOR_H, arc,
      sensor: { x0: Math.min(cx + d * 30, cx - d * 14), x1: Math.max(cx + d * 30, cx - d * 14), y0: y - IG_DOOR_H, y1: y + 4 } };
  }
  function buildColliders(L) {
    const out = [];
    { const g = igloo(L.goal);
      for (let i = 0; i < g.arc.length - 1; i++) out.push(seg(g.arc[i], g.arc[i + 1], 0, 'solid', { igloo: 1 }));
      out.push(seg([g.outerX, g.roofY], [g.roofX, g.roofY], 0, 'solid', { igloo: 1 }));
      if ((L.keys || []).length) out.push(seg([g.outerX, g.y], [g.outerX, g.roofY], 0, 'gate')); }
    out.push(seg([0, -3000], [0, H], 0), seg([W, -3000], [W, H], 0));
    for (const b of L.blocks || []) { const c = corners(b); for (let i = 0; i < 4; i++) out.push(seg(c[i], c[(i + 1) % 4], 0, 'solid', b.k ? { k: b.k } : undefined)); }
    for (const b of L.pads || []) {
      const c = corners(b);
      out.push(seg(c[0], c[1], 0, 'pad', { power: b.power || 17 }));
      for (let i = 1; i < 4; i++) out.push(seg(c[i], c[(i + 1) % 4], 0));
    }
    for (const b of L.spikes || []) { const c = corners(b); for (let i = 0; i < 4; i++) out.push(seg(c[i], c[(i + 1) % 4], 2, 'spike')); }
    for (const b of L.boosts || []) out.push(seg([b.x1, b.y - 1], [b.x2, b.y - 1], 0, 'boost', { dir: b.dir, speed: b.speed || BOOST }));
    (L.crumbles || []).forEach((b, ci) => { const c = corners(b); for (let i = 0; i < 4; i++) out.push(seg(c[i], c[(i + 1) % 4], 0, 'solid', { ci })); });
    return out;
  }

  function moverRect(m, frame) {
    const k = Math.sin(2 * Math.PI * frame / m.period + (m.phase || 0));
    return { x: m.x + (m.dx || 0) * k, y: m.y + (m.dy || 0) * k, w: m.w, h: m.h, a: m.a || 0 };
  }
  function updateMovers(w) {
    w.moverSegs.length = 0;
    for (const m of w.L.movers || []) { const c = corners(moverRect(m, w.frame)); for (let i = 0; i < 4; i++) w.moverSegs.push(seg(c[i], c[(i + 1) % 4], 2, 'spike')); }
  }
  function ballPos(b, frame) {
    if (b.rad) { const a = 2 * Math.PI * frame / b.period + (b.phase || 0); return [b.cx + Math.cos(a) * b.rad, b.cy + Math.sin(a) * b.rad]; }
    if (b.period) { const k = Math.sin(2 * Math.PI * frame / b.period + (b.phase || 0)); return [b.x + (b.dx || 0) * k, b.y + (b.dy || 0) * k]; }
    return [b.x, b.y];
  }
  // urchins with "wake" sit still until the penguin comes within that distance, then always run the same motion
  // from that moment (so the outcome depends on the route, not on when the run started)
  function ballClock(w, b, i) { if (!b.wake) return w.frame; const t0 = w.wakeAt && w.wakeAt[i]; return t0 === undefined || t0 < 0 ? 0 : w.frame - t0; }
  function makeWorld(L) {
    return {
      L, statics: buildColliders(L), strokes: [], strokeSegs: [],
      p: { x: L.start.x, y: L.start.y, vx: 0, vy: 0, dir: L.start.dir, grounded: false, gn: { x: 0, y: -1 }, turnCd: 0, impact: 0, lastTurn: 0 },
      rollers: (L.rollers || []).map(r => ({ x: r.x, y: r.y, vx: r.vx || 0, vy: 0, r: r.r || 15, delay: r.delay || 0, alive: true, rot: 0 })),
      crumble: (L.crumbles || []).map(() => -1), gone: (L.crumbles || []).map(() => false), moverSegs: [],
      ig: igloo(L.goal), keys: (L.keys || []).map(() => false), open: !(L.keys || []).length,
      state: 'ready', frame: 0, fish: (L.fish || []).map(() => false), inkUsed: 0, events: [], failReason: ''
    };
  }

  // can a stroke point be placed here?
  function canPlace(w, x, y) {
    if (x < 4 || x > W - 4 || y > SEA - 4) return false;
    const L = w.L; let bad = false;
    for (const b of L.blocks || []) if (inRect(x, y, b, 2)) return false;
    for (const b of L.pads || []) if (inRect(x, y, b, 3)) return false;
