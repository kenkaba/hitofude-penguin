<script>
(() => {
const { W, H, SEA, R, LINE_T, LEVELS } = PG;
const $ = id => document.getElementById(id);
const cv = $('cv'); let ctx = cv.getContext('2d');
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- persistence ----------
// ---- progress: stored per level NAME (survives stage re-ordering), in this browser AND in the viewer's Claude account ----
const SAVE_KEY = 'hitofude-penguin-progress';
let save = { byName: {}, fishBy: {}, goldBy: {}, inkBy: {}, equip: { hat: 'none', pen: 'ice' }, sound: true, stars: LEVELS.map(() => 0) };
const MAIN_N = LEVELS.filter(L => !L.secret).length, SECRET_I = LEVELS.findIndex(L => L.secret);
function syncStars() { save.stars = LEVELS.map(L => save.byName[L.name] || 0); }
function medalOf(L) { const b = save.inkBy[L.name]; return !!(b && L.dev && b <= L.dev + 0.5); }
function counts() { let fish = 0, medals = 0, gold = 0, stars = 0; LEVELS.forEach(L => { if (save.fishBy[L.name]) fish++; if (medalOf(L)) medals++; if (save.goldBy[L.name]) gold++; if (!L.secret) stars += save.byName[L.name] || 0; }); return { fish, medals, gold, stars }; }
function mergeProgress(p) {
  if (!p || typeof p !== 'object') return false; let changed = false;
  for (const [n, v] of Object.entries(p.byName || {})) { const s = Math.max(0, Math.min(3, v | 0)); if (s > (save.byName[n] || 0)) { save.byName[n] = s; changed = true; } }
  for (const [n, v] of Object.entries(p.fishBy || {})) if (v && !save.fishBy[n]) { save.fishBy[n] = true; changed = true; }
  for (const [n, v] of Object.entries(p.goldBy || {})) if (v && !save.goldBy[n]) { save.goldBy[n] = true; changed = true; }
  for (const [n, v] of Object.entries(p.inkBy || {})) { const x = +v; if (x > 0 && (!save.inkBy[n] || x < save.inkBy[n])) { save.inkBy[n] = x; changed = true; } }
  if (p.equip && p.equipAt && (!save.equipAt || p.equipAt > save.equipAt)) { save.equip = Object.assign({ hat: 'none', pen: 'ice' }, p.equip); save.equipAt = p.equipAt; changed = true; }
  if (typeof p.sound === 'boolean' && p.soundAt && (!save.soundAt || p.soundAt > save.soundAt)) { save.sound = p.sound; save.soundAt = p.soundAt; }
  return changed;
}
try {
  mergeProgress(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'));
  const legacy = JSON.parse(localStorage.getItem('hitofude-penguin-v6') || 'null');   // previous 50-stage save (same order)
  if (legacy && Array.isArray(legacy.stars)) { const m = {}; LEVELS.forEach((L, i) => { if (legacy.stars[i]) m[L.name] = legacy.stars[i]; }); mergeProgress({ byName: m }); if (typeof legacy.sound === 'boolean') save.sound = legacy.sound; }

const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const NP = NATIVE ? window.Capacitor.Plugins : null;
if (NP && NP.Preferences) NP.Preferences.get({ key: SAVE_KEY }).then(r => {
  let changed = false; try { changed = mergeProgress(JSON.parse((r && r.value) || 'null')); } catch (e) {}
  syncStars(); persist();
  if (changed) { syncSoundBtn(); if (mode === 'select') buildGrid(); }
}).catch(() => {});
let cloudDoc = null, cloudTimer = 0;
function persist() {
  syncStars();
  const data = { byName: save.byName, fishBy: save.fishBy, goldBy: save.goldBy, inkBy: save.inkBy, equip: save.equip, equipAt: save.equipAt || 0, sound: save.sound, soundAt: save.soundAt || 0 };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
  if (NP && NP.Preferences) NP.Preferences.set({ key: SAVE_KEY, value: JSON.stringify(data) }).catch(() => {});
  if (cloudDoc) { clearTimeout(cloudTimer); cloudTimer = setTimeout(() => { cloudDoc.set(Object.assign({ updatedAt: Date.now() }, data)).catch(() => {}); }, 400); }
}

(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;

    const snap = await cloudDoc.get();
    const changed = snap.exists ? mergeProgress(snap.data()) : false;
    syncStars(); persist();
    if (changed) { syncSoundBtn && syncSoundBtn(); if (mode === 'select') buildGrid(); }

// ---------- theme colors for canvas ----------
let C = {};

const SFX = {
  scratch() { const n = performance.now(); if (n - scratchT > 55) { scratchT = n; noise(.05, .05, 3200 + Math.random() * 1500); } },
  pop(len) { tone(660 + Math.min(500, len), .12, 'triangle', .12, 1.5); },
  blocked() { tone(180, .12, 'square', .05, .7); },
  go() { tone(523, .09, 'triangle', .14); tone(784, .14, 'triangle', .14, 1, .08); },
  fish(m = 1) { tone(988 * m, .08, 'sine', .16); tone(1319 * m, .16, 'sine', .14, 1, .07); },
  near() { noise(.22, .12, 2400); tone(1200, .22, 'sine', .08, .45); },
  boing() { tone(220, .28, 'sine', .22, 3.2); },
  boost() { noise(.25, .18, 900); tone(300, .25, 'sawtooth', .05, 3); },
  land(v) { noise(.07, Math.min(.25, v * .03), 500); },
  turn() { tone(420, .06, 'triangle', .06, .8); },

  ouch() { tone(620, .08, 'square', .08, .6); tone(300, .3, 'square', .07, .5, .08); },
  win(m = 1) { [523, 659, 784, 1047].forEach((f, i) => tone(f * m, .25, 'triangle', .14, 1, i * .09)); tone(2093 * m, .5, 'sine', .07, 1, .4); },
  key() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .16, 'triangle', .13, 1, i * .06)); },
